# dsh-mobile-ios bundle patch（X1 安装路径：desktop profile 的 bundle 列表 + 本文件）。
# 安全模型（2026-11-16 起）：局域网监听**默认开**（手机连电脑是产品核心路径）；
# 安全边界在管理面——配对码生成/桌面摘要/撤销永远回环-only（rest.mjs LOOPBACK 门）
# + 配对码一次性 + 设备 Bearer。此处的 allowLan:true 与插件默认值一致，显式写出便于发现。
- insert:
    - id: dsh-mobile-ios
      name: 'dsh-mobile-ios'
      config:
        # 端口被占用时自动顺延（R12：插件不能因端口冲突带崩宿主）
        port: 3081
        # 局域网监听：绑定 0.0.0.0，手机经 LAN IP 直连（网关日志会打印「手机端填这个地址」）
        allowLan: true
        # 设备注册表落盘：配对跨宿主重启保留，手机不用反复重配。
        # 不写则插件默认落 ~/.dsh/mobile-access/dsh-mobile-ios-devices.json（推荐）
        # pairingFile: /绝对路径/可选/.dsh/mobile-access/dsh-mobile-ios-devices.json
        # 隧道意外退出后自动重拉（插件形态默认已开，false 可关闭）
        # autoRestart: true
        # 宿主形态（X2 闭环）：显式 mux——进程内直取宿主 cordis 服务
        # （sessionController/agents/llm…），真数据进手机；mock 需显式 config.host='mock'
        host: mux
        # 桌面端登录账号（0.3.9，可选）：下发到手机设置页（OpenAPI HostInfo.user）。
        # 不写则插件尝试从宿主上下文读取，仍取不到就不发字段（手机显示「未登录」态）。
        # 注意 maskedContact 必须是已脱敏形式，禁止明文手机号；头像走 URL 不内联 base64。
        # user:
        #   id: u_xxx
        #   nickname: 大葉
        #   avatarUrl: https://…
        #   maskedContact: 138****6688
